<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vsdun - Premium Servers</title>
    <!-- Tailwind CSS -->
    <script src="libs/tailwindcss.js"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <!-- Vue 3 & I18n -->
    <script src="libs/vue.global.prod.js"></script>
    <script src="libs/vue-i18n.global.prod.js"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="app" v-cloak class="min-h-screen flex flex-col">
        <app-navbar></app-navbar>

        <main class="flex-grow">
            <!-- Hero Section -->
            <div class="relative bg-black overflow-hidden h-[500px]">
                <div class="absolute inset-0">
                    <img class="w-full h-full object-cover" src="images/hero-bg-sharp.jpg" alt="Data Center">
                    <div class="absolute inset-0 bg-black/60 mix-blend-multiply"></div>
                </div>
                <div class="relative max-w-7xl mx-auto py-24 px-4 sm:py-32 sm:px-6 lg:px-8 flex flex-col items-center text-center h-full justify-center">
                    <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl lg:text-5xl">{{ $t('home.hero_title') }}</h1>
                    <p class="mt-6 text-lg text-gray-300 max-w-3xl">{{ $t('home.hero_desc') }}</p>
                    <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="products.html" class="group inline-flex items-center justify-center px-10 py-4 border border-transparent text-lg font-bold rounded-full text-white bg-primary hover:bg-secondary hover:-translate-y-1 hover:shadow-2xl transition-all duration-300">
                            {{ $t('home.explore') }} <i class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-2 transition-transform"></i>
                        </a>
                        <a href="configurator.html" class="inline-flex items-center justify-center px-10 py-4 border border-transparent text-lg font-bold rounded-full text-primary bg-white hover:bg-gray-50 hover:-translate-y-1 hover:shadow-2xl transition-all duration-300">
                            {{ $t('home.custom') }}
                        </a>
                    </div>
                </div>
            </div>



            <!-- Categories -->
            <div class="py-16 bg-gray-50">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="space-y-16">
                        <!-- Main categories rendering loop -->
                        <div v-for="mainCat in mainCategories" :key="mainCat.id">
                            <h2 class="text-2xl font-bold text-gray-900 mb-8 border-l-4 border-primary pl-4">
                                {{ $t('home.' + mainCat.id) }}
                            </h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                <a :href="'products.html?category=' + subCat.id" v-for="subCat in getSubCategories(mainCat.id)" :key="subCat.id" class="group bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-xl transition-all duration-300 hover:-translate-y-1 flex flex-col cursor-pointer">
                                    <div class="h-48 overflow-hidden relative bg-white flex items-center justify-center p-8">
                                        <img :src="subCat.image" :alt="$t('home.' + subCat.id)" loading="lazy" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500">
                                    </div>
                                    <div class="p-5 flex-grow flex flex-col justify-between">
                                        <div>
                                            <h3 class="text-lg font-bold text-gray-900 mb-2 group-hover:text-primary transition-colors flex items-center">
                                                <i :class="['fa-solid', subCat.icon, 'mr-2 text-primary']"></i> {{ $t('home.' + subCat.id) }}
                                            </h3>
                                            <p class="text-gray-500 text-sm line-clamp-2">{{ $t('home.' + subCat.id + '_desc') }}</p>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <app-footer></app-footer>
    </div>

    <!-- Application Logic -->
    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Home page specific logic (just for the main categories loop)
        const homePageLogic = {
            data() {
                return {
                    mainCategories: serverData.mainCategories,
                    categories: serverData.categories
                }
            },
            methods: {
                getSubCategories(parentId) {
                    return this.categories.filter(c => c.parentId === parentId);
                }
            }
        };
        initVueApp(homePageLogic);
    </script>
</body>
</html>
